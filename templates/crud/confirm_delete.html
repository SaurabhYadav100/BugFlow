{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-4">{{ page_title }}</h1>
<div class="row"><div class="col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <p>Are you sure you want to delete?</p>
    <form method="post">{% csrf_token %}
      <div class="d-flex gap-2"><button class="btn btn-danger" type="submit">Delete</button><a class="btn btn-outline-secondary" href="{{ cancel_url }}">Cancel</a></div>
    </form>
  </div></div>
</div></div>
{% endblock %}
