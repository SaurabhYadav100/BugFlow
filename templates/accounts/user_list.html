{% extends "base.html" %}
{% load ui_tags %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3 mb-0">Users</h1>
  <a class="btn btn-primary" href="{% url 'user_create' %}">{% icon "plus" 15 %} Add User</a></div>
<div class="card shadow-sm"><div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Created Date</th><th>Action</th></tr></thead>
    <tbody>{% for u in users %}<tr><td>{{ u.pk }}</td><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.get_role_display }}</td><td>{{ u.created_at|date:"M d, Y" }}</td>
      <td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" href="{% url 'user_edit' u.pk %}">Edit</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'user_delete' u.pk %}">Delete</a></td></tr>{% endfor %}</tbody>
  </table></div></div>
{% endblock %}
