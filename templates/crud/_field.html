{% if field %}
{% if field.widget_type == "checkbox" %}
<div class="form-check mb-3">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% for e in field.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}</div>
{% else %}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label fw-semibold small">{{ field.label }}{% if field.field.required and not field.field.disabled %} *{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% for e in field.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>
{% endif %}
{% endif %}
