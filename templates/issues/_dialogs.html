{% load ui_tags %}
<div class="modal fade" id="assignModal" tabindex="-1" aria-labelledby="assignTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <form method="post" action="">
    {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div class="modal-header"><h2 class="modal-title h5" id="assignTitle">Assign Issue</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label fw-semibold small" for="assignIssue">Issue ID</label><input class="form-control" id="assignIssue" data-fill="label" readonly></div>
      <div class="mb-3"><label class="form-label fw-semibold small" for="assignSelect">Assign To</label>
        <select class="form-select" id="assignSelect" name="assignee" data-fill="assignee"><option value="">Select Developer</option>
          {% for d in developers %}<option value="{{ d.pk }}">{{ d.name }} ({{ d.get_role_display }})</option>{% endfor %}</select></div>
      <div class="mb-1"><label class="form-label fw-semibold small" for="assignComment">Comments (Optional)</label><textarea class="form-control" id="assignComment" name="comment" rows="3" placeholder="Add a note for the assignee"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Assign</button></div>
  </form>
</div></div></div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <form method="post" action="">
    {% csrf_token %}
    <div class="modal-body text-center p-4">
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
      <span class="d-inline-flex rounded-circle bg-danger text-white p-3 mb-3">{% icon "trash" 26 %}</span>
      <h2 class="h5" id="deleteTitle">Delete Issue</h2>
      <p class="mb-1">Are you sure you want to delete this issue?</p>
      <p class="fw-semibold text-body-secondary mb-4" data-fill="label"></p>
      <div class="d-flex justify-content-center gap-2"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" type="submit">Delete</button></div>
    </div>
  </form>
</div></div></div>
