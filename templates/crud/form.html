{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-4">{{ page_title }}</h1>
<div class="row"><div class="col-lg-8 col-xl-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
      {% for field in form %}{% include "crud/_field.html" %}{% endfor %}
      <div class="d-flex gap-2 pt-2">
        <button class="btn btn-primary px-4" type="submit">{{ submit_label|default:"Save" }}</button>
        <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
